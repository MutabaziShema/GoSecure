<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GoSecure — Safe hands for every journey</title>
  <meta name="description" content="GoSecure connects you with verified drivers who safely drive you in your own car. Human-controlled dispatch. Book via WhatsApp or call our hotline." />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- React + Babel -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: #F7F9FC;
      color: #1F2933;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    img { max-width: 100%; }
    button, input, select, textarea { font-family: inherit; }

    /* Responsive */
    @media (max-width: 768px) {
      .desktop-nav { display: none !important; }
      .hamburger-btn { display: flex !important; }
    }
    @media (min-width: 769px) {
      .mobile-menu { display: none !important; }
    }
    @media (max-width: 900px) {
      .hero-grid { grid-template-columns: 1fr !important; gap: 48px !important; padding: 60px 24px !important; }
      .hero-visual { order: -1; }
      .steps-grid { grid-template-columns: 1fr 1fr !important; }
      .connector-line { display: none !important; }
      .features-grid { grid-template-columns: 1fr 1fr !important; }
    }
    @media (max-width: 768px) {
      .usecases-grid { grid-template-columns: 1fr !important; gap: 40px !important; }
      .about-grid { grid-template-columns: 1fr !important; gap: 48px !important; }
    }
    @media (max-width: 700px) {
      .safety-grid { grid-template-columns: 1fr !important; gap: 40px !important; }
    }
    @media (max-width: 600px) {
      .form-row { grid-template-columns: 1fr !important; }
      .booking-form-card { padding: 28px 20px !important; }
    }
    @media (max-width: 520px) {
      .steps-grid { grid-template-columns: 1fr !important; }
      .features-grid { grid-template-columns: 1fr !important; }
      .footer-grid { grid-template-columns: 1fr !important; }
      .hero-btns { flex-direction: column !important; }
      .hero-btns a, .hero-btns button { width: 100% !important; justify-content: center !important; }
    }
    @media (max-width: 900px) {
      .footer-grid { grid-template-columns: 1fr 1fr !important; }
    }

    * { transition-property: color, background-color, border-color, box-shadow, transform, opacity; transition-duration: 0.2s; }
    input, textarea, select { transition: border-color 0.2s, box-shadow 0.2s !important; }
    button:focus-visible, a:focus-visible {
      outline: 2px solid #00A86B;
      outline-offset: 3px;
      border-radius: 6px;
    }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback, Fragment } = React;

    // ─── Shared Utilities ────────────────────────────────────────────────────

    const ACCENT  = '#00A86B';
    const NAVY    = '#0B1F3A';
    const GOLD    = '#F5B84B';
    const OFFWHITE = '#F7F9FC';
    const BORDER  = '#E5EAF0';
    const TEXT    = '#1F2933';
    const MUTED   = '#4A5568';

    const scrollTo = (href) => {
      const el = document.querySelector(href);
      if (el) {
        const top = el.getBoundingClientRect().top + window.scrollY - 80;
        window.scrollTo({ top, behavior: 'smooth' });
      }
    };

    // ─── Section Heading ─────────────────────────────────────────────────────

    const SectionHeading = ({ eyebrow, title, subtitle, center = false }) => (
      <div style={{ textAlign: center ? 'center' : 'left', maxWidth: center ? 600 : '100%', margin: center ? '0 auto' : '0' }}>
        {eyebrow && (
          <div style={{
            display: 'inline-flex', alignItems: 'center', gap: 8,
            fontFamily: 'Inter, sans-serif', fontWeight: 600, fontSize: 12,
            color: ACCENT, letterSpacing: '0.1em', textTransform: 'uppercase', marginBottom: 12,
          }}>
            <div style={{ width: 20, height: 2, background: ACCENT }}></div>
            {eyebrow}
            <div style={{ width: 20, height: 2, background: ACCENT }}></div>
          </div>
        )}
        <h2 style={{
          fontFamily: 'Poppins, sans-serif', fontWeight: 700,
          fontSize: 'clamp(28px, 3.5vw, 42px)', color: NAVY,
          margin: '0 0 16px', letterSpacing: '-0.02em', lineHeight: 1.2,
        }}>{title}</h2>
        {subtitle && (
          <p style={{ fontFamily: 'Inter, sans-serif', fontSize: 17, color: MUTED, lineHeight: 1.65, margin: 0 }}>
            {subtitle}
          </p>
        )}
      </div>
    );

    // ─── Header ──────────────────────────────────────────────────────────────

    const Header = ({ onBookNow }) => {
      const [menuOpen, setMenuOpen] = useState(false);
      const [scrolled, setScrolled] = useState(false);

      useEffect(() => {
        const onScroll = () => setScrolled(window.scrollY > 20);
        window.addEventListener('scroll', onScroll);
        return () => window.removeEventListener('scroll', onScroll);
      }, []);

      const navLinks = [
        { label: 'Home', href: '#home' },
        { label: 'How It Works', href: '#how-it-works' },
        { label: 'Why GoSecure', href: '#why-gosecure' },
        { label: 'Safety', href: '#safety' },
        { label: 'FAQ', href: '#faq' },
        { label: 'Contact', href: '#contact' },
      ];

      const handleNav = (e, href) => {
        e.preventDefault();
        setMenuOpen(false);
        scrollTo(href);
      };

      return (
        <header style={{
          position: 'fixed', top: 0, left: 0, right: 0, zIndex: 1000,
          background: scrolled ? 'rgba(247,249,252,0.97)' : 'rgba(247,249,252,0.95)',
          backdropFilter: 'blur(12px)',
          borderBottom: scrolled ? `1px solid ${BORDER}` : '1px solid transparent',
          boxShadow: scrolled ? `0 2px 20px rgba(11,31,58,0.06)` : 'none',
          transition: 'all 0.3s ease',
        }}>
          <div style={{
            maxWidth: 1200, margin: '0 auto', padding: '0 24px',
            display: 'flex', alignItems: 'center', justifyContent: 'space-between', height: 72,
          }}>
            {/* Logo */}
            <a href="#home" onClick={(e) => handleNav(e, '#home')} style={{ display: 'flex', alignItems: 'center', textDecoration: 'none', flexShrink: 0 }}>
              <img src="gosecure-logo.png" alt="GoSecure — Safe hands for every journey" style={{ height: 40, width: 'auto', display: 'block' }} />
            </a>

            {/* Desktop Nav */}
            <nav style={{ display: 'flex', alignItems: 'center', gap: 32 }} className="desktop-nav">
              {navLinks.map(link => (
                <a key={link.href} href={link.href} onClick={(e) => handleNav(e, link.href)}
                  style={{ textDecoration: 'none', color: TEXT, fontSize: 14, fontWeight: 500, fontFamily: 'Inter, sans-serif', letterSpacing: '0.01em', whiteSpace: 'nowrap' }}
                  onMouseEnter={e => e.target.style.color = ACCENT}
                  onMouseLeave={e => e.target.style.color = TEXT}
                >{link.label}</a>
              ))}
            </nav>

            <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
              <button onClick={() => onBookNow && onBookNow()} className="desktop-nav" style={{
                background: ACCENT, color: '#fff', padding: '10px 22px', borderRadius: 8,
                fontFamily: 'Inter, sans-serif', fontWeight: 600, fontSize: 14,
                border: 'none', cursor: 'pointer', whiteSpace: 'nowrap',
                boxShadow: '0 2px 8px rgba(0,168,107,0.25)',
              }}
                onMouseEnter={e => { e.currentTarget.style.background = '#009960'; e.currentTarget.style.transform = 'translateY(-1px)'; }}
                onMouseLeave={e => { e.currentTarget.style.background = ACCENT; e.currentTarget.style.transform = 'none'; }}
              >Book Now</button>

              {/* Hamburger */}
              <button className="hamburger-btn" onClick={() => setMenuOpen(!menuOpen)}
                style={{ background: 'none', border: 'none', cursor: 'pointer', padding: 8, display: 'none', flexDirection: 'column', gap: 5, alignItems: 'center', justifyContent: 'center' }}
                aria-label="Toggle navigation">
                <span style={{ display: 'block', width: 24, height: 2, background: NAVY, borderRadius: 2, transform: menuOpen ? 'translateY(7px) rotate(45deg)' : 'none' }}></span>
                <span style={{ display: 'block', width: 24, height: 2, background: NAVY, borderRadius: 2, opacity: menuOpen ? 0 : 1 }}></span>
                <span style={{ display: 'block', width: 24, height: 2, background: NAVY, borderRadius: 2, transform: menuOpen ? 'translateY(-7px) rotate(-45deg)' : 'none' }}></span>
              </button>
            </div>
          </div>

          {/* Mobile Menu */}
          <div style={{
            maxHeight: menuOpen ? 400 : 0, overflow: 'hidden',
            background: OFFWHITE, borderTop: menuOpen ? `1px solid ${BORDER}` : 'none',
            transition: 'max-height 0.35s ease',
          }} className="mobile-menu">
            <div style={{ padding: '16px 24px 24px' }}>
              {navLinks.map(link => (
                <a key={link.href} href={link.href} onClick={(e) => handleNav(e, link.href)}
                  style={{ display: 'block', padding: '12px 0', textDecoration: 'none', color: TEXT, fontFamily: 'Inter, sans-serif', fontWeight: 500, fontSize: 16, borderBottom: `1px solid ${BORDER}` }}>
                  {link.label}
                </a>
              ))}
              <button onClick={() => { setMenuOpen(false); onBookNow && onBookNow(); }}
                style={{ display: 'block', marginTop: 16, width: '100%', background: ACCENT, color: '#fff', padding: '14px 22px', borderRadius: 8, fontFamily: 'Inter, sans-serif', fontWeight: 600, fontSize: 16, border: 'none', cursor: 'pointer', textAlign: 'center' }}>
                Book Now
              </button>
            </div>
          </div>
        </header>
      );
    };

    // ─── Hero ────────────────────────────────────────────────────────────────

    const HeroVisualCard = () => {
      const [step, setStep] = useState(0);
      useEffect(() => {
        const t = setInterval(() => setStep(s => (s + 1) % 3), 2000);
        return () => clearInterval(t);
      }, []);

      const statuses = [
        { label: 'Request Received', color: GOLD, bg: 'rgba(245,184,75,0.12)' },
        { label: 'Officer Assigned', color: ACCENT, bg: 'rgba(0,168,107,0.12)' },
        { label: 'Driver Confirmed', color: NAVY, bg: 'rgba(11,31,58,0.1)' },
      ];

      return (
        <div style={{ position: 'relative', width: '100%', maxWidth: 440 }}>
          {/* Main booking card */}
          <div style={{ background: '#fff', borderRadius: 20, padding: 28, boxShadow: '0 20px 60px rgba(11,31,58,0.12), 0 4px 16px rgba(11,31,58,0.06)', position: 'relative', zIndex: 2 }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 24 }}>
              <div>
                <div style={{ fontFamily: 'Poppins, sans-serif', fontWeight: 700, fontSize: 16, color: NAVY }}>Booking Request</div>
                <div style={{ fontFamily: 'Inter, sans-serif', fontSize: 12, color: '#718096', marginTop: 2 }}>Managed by GoSecure ops</div>
              </div>
              <div style={{ width: 44, height: 44, background: `linear-gradient(135deg, ${NAVY} 0%, #1a3a5c 100%)`, borderRadius: 12, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
                  <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" fill={ACCENT} stroke={ACCENT} strokeWidth="0.5"/>
                  <path d="M9 12l2 2 4-4" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
                </svg>
              </div>
            </div>

            {/* Route */}
            <div style={{ background: OFFWHITE, borderRadius: 12, padding: 16, marginBottom: 20, border: `1px solid ${BORDER}` }}>
              <div style={{ display: 'flex', alignItems: 'flex-start', gap: 12 }}>
                <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', paddingTop: 2 }}>
                  <div style={{ width: 10, height: 10, borderRadius: '50%', background: ACCENT, border: '2px solid #fff', boxShadow: `0 0 0 2px ${ACCENT}` }}></div>
                  <div style={{ width: 2, height: 28, background: `linear-gradient(180deg, ${ACCENT}, ${NAVY})`, margin: '3px 0' }}></div>
                  <div style={{ width: 10, height: 10, borderRadius: 3, background: NAVY, border: '2px solid #fff', boxShadow: `0 0 0 2px ${NAVY}` }}></div>
                </div>
                <div style={{ flex: 1 }}>
                  <div style={{ marginBottom: 16 }}>
                    <div style={{ fontFamily: 'Inter, sans-serif', fontSize: 11, color: '#718096', fontWeight: 500, textTransform: 'uppercase', letterSpacing: '0.05em' }}>Pickup</div>
                    <div style={{ fontFamily: 'Inter, sans-serif', fontSize: 14, color: TEXT, fontWeight: 600 }}>Kacyiru, Kigali</div>
                  </div>
                  <div>
                    <div style={{ fontFamily: 'Inter, sans-serif', fontSize: 11, color: '#718096', fontWeight: 500, textTransform: 'uppercase', letterSpacing: '0.05em' }}>Destination</div>
                    <div style={{ fontFamily: 'Inter, sans-serif', fontSize: 14, color: TEXT, fontWeight: 600 }}>Nyamirambo, Kigali</div>
                  </div>
                </div>
              </div>
            </div>

            {/* Status badges */}
            <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', marginBottom: 20 }}>
              {statuses.map((s, i) => (
                <span key={s.label} style={{
                  fontFamily: 'Inter, sans-serif', fontSize: 11, fontWeight: 600,
                  color: i === step ? s.color : '#A0AEC0',
                  background: i === step ? s.bg : 'transparent',
                  border: `1px solid ${i === step ? s.color : BORDER}`,
                  borderRadius: 100, padding: '4px 10px', transition: 'all 0.5s ease',
                }}>{s.label}</span>
              ))}
            </div>

            {/* Driver card */}
            <div style={{ display: 'flex', alignItems: 'center', gap: 12, background: `linear-gradient(135deg, ${NAVY} 0%, #1a3560 100%)`, borderRadius: 12, padding: '12px 16px' }}>
              <div style={{ width: 40, height: 40, borderRadius: '50%', background: `linear-gradient(135deg, ${ACCENT}, #009960)`, display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2">
                  <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/>
                </svg>
              </div>
              <div style={{ flex: 1 }}>
                <div style={{ fontFamily: 'Poppins, sans-serif', fontSize: 13, fontWeight: 600, color: '#fff' }}>Verified Driver</div>
                <div style={{ fontFamily: 'Inter, sans-serif', fontSize: 11, color: 'rgba(255,255,255,0.6)' }}>ID verified • Background checked</div>
              </div>
              <div style={{ background: 'rgba(0,168,107,0.2)', border: '1px solid rgba(0,168,107,0.4)', borderRadius: 6, padding: '3px 8px' }}>
                <span style={{ fontFamily: 'Inter, sans-serif', fontSize: 11, fontWeight: 700, color: ACCENT }}>✓</span>
              </div>
            </div>
          </div>

          {/* Floating time chip */}
          <div style={{ position: 'absolute', top: -18, right: -18, background: '#fff', borderRadius: 14, padding: '10px 16px', boxShadow: '0 8px 30px rgba(11,31,58,0.12)', display: 'flex', alignItems: 'center', gap: 8, zIndex: 3 }}>
            <div style={{ width: 8, height: 8, borderRadius: '50%', background: GOLD }}></div>
            <span style={{ fontFamily: 'Inter, sans-serif', fontSize: 12, fontWeight: 600, color: NAVY }}>Est. 15 min</span>
          </div>

          {/* Floating WhatsApp chip */}
          <div style={{ position: 'absolute', bottom: -18, left: -18, background: '#fff', borderRadius: 14, padding: '10px 16px', boxShadow: '0 8px 30px rgba(11,31,58,0.12)', display: 'flex', alignItems: 'center', gap: 8, zIndex: 3 }}>
            <div style={{ width: 28, height: 28, borderRadius: 8, background: '#25D366', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="#fff"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
            </div>
            <span style={{ fontFamily: 'Inter, sans-serif', fontSize: 12, fontWeight: 600, color: NAVY }}>Booked via WhatsApp</span>
          </div>

          {/* Decorative blob */}
          <div style={{ position: 'absolute', top: '50%', left: '50%', transform: 'translate(-50%, -50%)', width: '110%', height: '110%', background: `radial-gradient(ellipse, rgba(0,168,107,0.06) 0%, transparent 70%)`, borderRadius: '50%', zIndex: 1, pointerEvents: 'none' }}></div>
        </div>
      );
    };

    const Hero = ({ onBookNow }) => (
      <section id="home" style={{ minHeight: '100vh', background: OFFWHITE, display: 'flex', alignItems: 'center', paddingTop: 72, position: 'relative', overflow: 'hidden' }}>
        <div style={{ position: 'absolute', top: -120, right: -120, width: 600, height: 600, borderRadius: '50%', background: 'radial-gradient(circle, rgba(0,168,107,0.06) 0%, transparent 70%)', pointerEvents: 'none' }}></div>
        <div style={{ position: 'absolute', bottom: -80, left: -80, width: 400, height: 400, borderRadius: '50%', background: 'radial-gradient(circle, rgba(11,31,58,0.05) 0%, transparent 70%)', pointerEvents: 'none' }}></div>
        <div style={{ position: 'absolute', inset: 0, backgroundImage: 'radial-gradient(circle, rgba(11,31,58,0.04) 1px, transparent 1px)', backgroundSize: '40px 40px', pointerEvents: 'none' }}></div>

        <div style={{ maxWidth: 1200, margin: '0 auto', padding: '80px 24px', display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 64, alignItems: 'center', width: '100%', position: 'relative' }} className="hero-grid">
          <div>
            {/* Badge */}
            <div style={{ display: 'inline-flex', alignItems: 'center', gap: 8, background: 'rgba(0,168,107,0.1)', border: '1px solid rgba(0,168,107,0.2)', borderRadius: 100, padding: '6px 14px', marginBottom: 28 }}>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke={ACCENT} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
              <span style={{ fontFamily: 'Inter, sans-serif', fontWeight: 600, fontSize: 13, color: ACCENT, letterSpacing: '0.02em' }}>Trusted driver-dispatch service</span>
            </div>

            <h1 style={{ fontFamily: 'Poppins, sans-serif', fontWeight: 700, fontSize: 'clamp(36px, 4.5vw, 58px)', lineHeight: 1.15, color: NAVY, margin: '0 0 20px', letterSpacing: '-0.02em' }}>
              Book a trusted driver<br />
              <span style={{ color: ACCENT }}>for your car</span>, anytime.
            </h1>

            <p style={{ fontFamily: 'Inter, sans-serif', fontSize: 'clamp(15px, 1.8vw, 18px)', color: MUTED, lineHeight: 1.7, margin: '0 0 36px', maxWidth: 520 }}>
              GoSecure connects you with verified drivers who can safely drive you in your own car. Every request is managed by our operations team from booking to completion.
            </p>

            <div style={{ display: 'flex', gap: 16, flexWrap: 'wrap', marginBottom: 32 }} className="hero-btns">
              <button onClick={() => onBookNow && onBookNow()} style={{ display: 'inline-flex', alignItems: 'center', gap: 10, background: ACCENT, color: '#fff', border: 'none', padding: '15px 28px', borderRadius: 10, fontFamily: 'Inter, sans-serif', fontWeight: 700, fontSize: 15, cursor: 'pointer', boxShadow: '0 4px 20px rgba(0,168,107,0.3)' }}
                onMouseEnter={e => { e.currentTarget.style.background = '#009960'; e.currentTarget.style.transform = 'translateY(-2px)'; e.currentTarget.style.boxShadow = '0 8px 28px rgba(0,168,107,0.35)'; }}
                onMouseLeave={e => { e.currentTarget.style.background = ACCENT; e.currentTarget.style.transform = 'none'; e.currentTarget.style.boxShadow = '0 4px 20px rgba(0,168,107,0.3)'; }}>

    // ─── Booking Form ─────────────────────────────────────────────────────────

    const useBookingForm = () => {
      const [form, setForm] = useState({ name: '', phone: '', pickup: '', destination: '', time: '', carType: 'Not sure', note: '' });
      const [errors, setErrors] = useState({});
      const [submitted, setSubmitted] = useState(false);

      const update = (field, value) => {
        setForm(prev => ({ ...prev, [field]: value }));
        if (errors[field]) setErrors(prev => ({ ...prev, [field]: '' }));
      };

      const validate = () => {
        const required = { name: 'Full name', phone: 'Phone number', pickup: 'Pickup location', destination: 'Destination', time: 'Preferred time' };
        const newErrors = {};
        Object.entries(required).forEach(([key, label]) => { if (!form[key].trim()) newErrors[key] = `${label} is required`; });
        return newErrors;
      };

      const handleWhatsApp = (e, afterOpen) => {
        e.preventDefault();
        const errs = validate();
        if (Object.keys(errs).length > 0) { setErrors(errs); return; }
        const waNumber = '250785246694';
        const msg = `Hello GoSecure, I need a trusted driver.\n\nName: ${form.name}\nPhone: ${form.phone}\nPickup location: ${form.pickup}\nDestination: ${form.destination}\nPreferred time: ${form.time}\nCar type: ${form.carType}\nExtra note: ${form.note || 'None'}`;
        window.open(`https://wa.me/${waNumber}?text=${encodeURIComponent(msg)}`, '_blank');
        setSubmitted(true);
        setTimeout(() => { setSubmitted(false); afterOpen && afterOpen(); }, 2500);
      };

      return { form, errors, submitted, update, handleWhatsApp };
    };

    const inputBase = (err) => ({
      width: '100%', padding: '13px 16px', borderRadius: 10,
      border: `1.5px solid ${err ? '#E53E3E' : BORDER}`,
      background: err ? 'rgba(229,62,62,0.03)' : '#fff',
      fontFamily: 'Inter, sans-serif', fontSize: 15, color: TEXT, outline: 'none', boxSizing: 'border-box',
    });
    const labelBase = { display: 'block', fontFamily: 'Inter, sans-serif', fontSize: 13, fontWeight: 600, color: NAVY, marginBottom: 6, letterSpacing: '0.01em' };
    const errMsg = (msg) => msg ? <span style={{ fontFamily: 'Inter, sans-serif', fontSize: 12, color: '#E53E3E', marginTop: 4, display: 'block' }}>{msg}</span> : null;
    const onFocus = e => { e.target.style.borderColor = ACCENT; e.target.style.boxShadow = '0 0 0 3px rgba(0,168,107,0.12)'; };
    const onBlur = (err) => e => { e.target.style.borderColor = err ? '#E53E3E' : BORDER; e.target.style.boxShadow = 'none'; };

    const BookingForm = () => {
      const { form, errors, submitted, update, handleWhatsApp } = useBookingForm();

      return (
        <section id="booking" style={{ background: `linear-gradient(180deg, ${OFFWHITE} 0%, #fff 100%)`, padding: '96px 24px' }}>
          <div style={{ maxWidth: 760, margin: '0 auto' }}>
            <SectionHeading eyebrow="Book a driver" title="Book a trusted driver" subtitle="Fill in your details and we'll prepare a WhatsApp message for our operations team." center />
            <div style={{ background: '#fff', borderRadius: 24, padding: '48px 48px', boxShadow: '0 20px 60px rgba(11,31,58,0.08), 0 4px 16px rgba(11,31,58,0.04)', border: `1px solid ${BORDER}`, marginTop: 48 }} className="booking-form-card">
              <form onSubmit={(e) => handleWhatsApp(e)} noValidate>
                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 20, marginBottom: 20 }} className="form-row">
                  <div><label style={labelBase}>Full name <span style={{ color: '#E53E3E' }}>*</span></label><input type="text" placeholder="e.g. Jean-Paul Nzeyimana" value={form.name} onChange={e => update('name', e.target.value)} style={inputBase(errors.name)} onFocus={onFocus} onBlur={onBlur(errors.name)} />{errMsg(errors.name)}</div>
                  <div><label style={labelBase}>Phone number <span style={{ color: '#E53E3E' }}>*</span></label><input type="tel" placeholder="e.g. +250 7XX XXX XXX" value={form.phone} onChange={e => update('phone', e.target.value)} style={inputBase(errors.phone)} onFocus={onFocus} onBlur={onBlur(errors.phone)} />{errMsg(errors.phone)}</div>
                </div>
                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 20, marginBottom: 20 }} className="form-row">
                  <div><label style={labelBase}>Pickup location <span style={{ color: '#E53E3E' }}>*</span></label><input type="text" placeholder="e.g. Kacyiru, Kigali" value={form.pickup} onChange={e => update('pickup', e.target.value)} style={inputBase(errors.pickup)} onFocus={onFocus} onBlur={onBlur(errors.pickup)} />{errMsg(errors.pickup)}</div>

                <div style={{ width: 180, height: 180, background: 'rgba(255,255,255,0.05)', borderRadius: 40, border: '1px solid rgba(0,168,107,0.25)', display: 'flex', alignItems: 'center', justifyContent: 'center', position: 'relative' }}>
                  <svg width="90" height="90" viewBox="0 0 24 24" fill="none">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" fill="rgba(0,168,107,0.15)" stroke={ACCENT} strokeWidth="1.5" />
                    <path d="M9 12l2 2 4-4" stroke={ACCENT} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />
                  </svg>
                  <div style={{ position: 'absolute', inset: -8, borderRadius: 48, border: '2px solid rgba(245,184,75,0.2)' }}></div>
                </div>
              </div>
              <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
                {promises.map((promise, i) => (
                  <div key={i} style={{ display: 'flex', alignItems: 'flex-start', gap: 16, background: 'rgba(255,255,255,0.04)', border: '1px solid rgba(255,255,255,0.07)', borderRadius: 14, padding: '18px 20px' }}
                    onMouseEnter={e => { e.currentTarget.style.background = 'rgba(0,168,107,0.08)'; e.currentTarget.style.borderColor = 'rgba(0,168,107,0.2)'; }}
                    onMouseLeave={e => { e.currentTarget.style.background = 'rgba(255,255,255,0.04)'; e.currentTarget.style.borderColor = 'rgba(255,255,255,0.07)'; }}>
                    <div style={{ width: 28, height: 28, flexShrink: 0, background: 'rgba(0,168,107,0.15)', border: '1px solid rgba(0,168,107,0.3)', borderRadius: 8, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke={ACCENT} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                    </div>
                    <span style={{ fontFamily: 'Inter, sans-serif', fontSize: 15, fontWeight: 500, color: 'rgba(255,255,255,0.88)', lineHeight: 1.5 }}>{promise}</span>
                  </div>
                ))}
              </div>
            </div>
          </div>
        </section>
      );
    };

    // ─── FAQ ─────────────────────────────────────────────────────────────────

    const FAQ = () => {
      const [open, setOpen] = useState(null);
      const items = [
        { q: 'Do I need to download an app?', a: 'No. You can book through WhatsApp or by calling our hotline. No app download is required.' },
        { q: 'Does the driver come with a car?', a: 'No. GoSecure provides a trusted driver to drive you in your own car. You keep control of your vehicle.' },
        { q: 'Can I book immediately?', a: 'Yes, you can request a driver anytime. Availability depends on driver location and confirmation by our operations team.' },
        { q: 'Are drivers verified?', a: 'Yes. All drivers are reviewed and verified before being assigned to any customer request.' },
        { q: 'Can I cancel?', a: 'Yes. Cancellation rules may apply depending on timing and whether a driver has already been assigned.' },
        { q: 'How is my request managed?', a: 'Every request is handled by an operations officer who monitors it until completion or cancellation.' },
      ];

      return (
        <section id="faq" style={{ background: OFFWHITE, padding: '96px 24px' }}>
          <div style={{ maxWidth: 760, margin: '0 auto' }}>
            <SectionHeading eyebrow="FAQ" title="Frequently asked questions" subtitle="Everything you need to know before booking your first trip." center />
            <div style={{ marginTop: 56, display: 'flex', flexDirection: 'column', gap: 12 }}>
              {items.map((item, i) => (
                <div key={i} style={{ background: '#fff', borderRadius: 14, border: `1.5px solid ${open === i ? 'rgba(0,168,107,0.3)' : BORDER}`, overflow: 'hidden' }}>
                  <button onClick={() => setOpen(open === i ? null : i)} style={{ width: '100%', display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '20px 24px', background: 'none', border: 'none', cursor: 'pointer', textAlign: 'left' }}>
                    <span style={{ fontFamily: 'Poppins, sans-serif', fontSize: 16, fontWeight: 600, color: NAVY, lineHeight: 1.4, paddingRight: 16 }}>{item.q}</span>
                    <div style={{ width: 32, height: 32, flexShrink: 0, background: open === i ? ACCENT : OFFWHITE, border: `1px solid ${open === i ? ACCENT : BORDER}`, borderRadius: 8, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke={open === i ? '#fff' : NAVY} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" style={{ transform: open === i ? 'rotate(180deg)' : 'none', transition: 'transform 0.3s' }}>
                        <polyline points="6 9 12 15 18 9"/>
                      </svg>
                    </div>
                  </button>
                  <div style={{ maxHeight: open === i ? 200 : 0, overflow: 'hidden', transition: 'max-height 0.35s ease' }}>
                    <p style={{ fontFamily: 'Inter, sans-serif', fontSize: 15, color: MUTED, lineHeight: 1.65, padding: '16px 24px 20px', margin: 0, borderTop: `1px solid ${BORDER}` }}>{item.a}</p>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </section>
      );
    };

    // ─── Footer ───────────────────────────────────────────────────────────────

    const Footer = ({ onBookNow }) => {
      const PhoneIcon = () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.7)" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 9.8a19.79 19.79 0 01-3.07-8.66A2 2 0 012 3h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L6.09 10.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 18v.92z"/></svg>;

      const contacts = [
        { icon: <PhoneIcon />, label: '+250 785 246 694', sub: 'WhatsApp' },
        { icon: <PhoneIcon />, label: '+250 785 246 694', sub: 'Hotline' },
        { icon: <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.7)" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>, label: 'hello@gosecure.rw', sub: 'Email' },
        { icon: <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.7)" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>, label: 'Kigali, Rwanda', sub: 'Location' },
      ];

      return (
        <footer id="contact" style={{ background: NAVY, color: '#fff', padding: '72px 24px 32px', position: 'relative', overflow: 'hidden' }}>
          <div style={{ position: 'absolute', top: 0, left: 0, right: 0, height: 3, background: `linear-gradient(90deg, ${GOLD}, rgba(245,184,75,0.3))` }}></div>
          <div style={{ maxWidth: 1200, margin: '0 auto' }}>
            <div style={{ display: 'grid', gridTemplateColumns: '2fr 1fr 1fr 1fr', gap: 48, marginBottom: 64 }} className="footer-grid">
              {/* Brand */}
              <div>
                <img src="gosecure-logo.png" alt="GoSecure" style={{ height: 40, width: 'auto', marginBottom: 20, filter: 'brightness(0) invert(1)' }} />
                <p style={{ fontFamily: 'Inter, sans-serif', fontSize: 14, color: 'rgba(255,255,255,0.6)', lineHeight: 1.7, margin: '0 0 24px', maxWidth: 280 }}>
                  Trusted driver-dispatch service connecting customers with verified drivers. Human-controlled. Kigali-based.
                </p>
                <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
                  {contacts.map((item, i) => (
                    <div key={i} style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                      <div style={{ width: 28, height: 28, background: 'rgba(255,255,255,0.06)', borderRadius: 7, display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>{item.icon}</div>
                      <div>
                        <div style={{ fontFamily: 'Inter, sans-serif', fontSize: 13, color: 'rgba(255,255,255,0.85)', fontWeight: 500 }}>{item.label}</div>
                        <div style={{ fontFamily: 'Inter, sans-serif', fontSize: 11, color: 'rgba(255,255,255,0.4)' }}>{item.sub}</div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>

              {/* Navigate */}
              <div>
                <h4 style={{ fontFamily: 'Poppins, sans-serif', fontWeight: 700, fontSize: 14, color: '#fff', margin: '0 0 20px', letterSpacing: '0.05em', textTransform: 'uppercase' }}>Navigate</h4>
                {[['Home', '#home'], ['How It Works', '#how-it-works'], ['Why GoSecure', '#why-gosecure'], ['Safety', '#safety'], ['FAQ', '#faq']].map(([label, href]) => (
                  <a key={label} href={href} onClick={e => { e.preventDefault(); scrollTo(href); }}
                    style={{ display: 'block', fontFamily: 'Inter, sans-serif', fontSize: 14, color: 'rgba(255,255,255,0.55)', textDecoration: 'none', marginBottom: 12 }}
                    onMouseEnter={e => e.target.style.color = ACCENT}
                    onMouseLeave={e => e.target.style.color = 'rgba(255,255,255,0.55)'}
                  >{label}</a>
                ))}
              </div>

              {/* Services */}
              <div>
                <h4 style={{ fontFamily: 'Poppins, sans-serif', fontWeight: 700, fontSize: 14, color: '#fff', margin: '0 0 20px', letterSpacing: '0.05em', textTransform: 'uppercase' }}>Services</h4>
                {['Driver dispatch', 'Safe night movement', 'Family trips', 'Corporate driving', 'Temporary support'].map(item => (
                  <div key={item} style={{ fontFamily: 'Inter, sans-serif', fontSize: 14, color: 'rgba(255,255,255,0.55)', marginBottom: 12 }}>{item}</div>
                ))}
              </div>

              {/* Book Now CTA */}
              <div>
                <h4 style={{ fontFamily: 'Poppins, sans-serif', fontWeight: 700, fontSize: 14, color: '#fff', margin: '0 0 20px', letterSpacing: '0.05em', textTransform: 'uppercase' }}>Book now</h4>
                <p style={{ fontFamily: 'Inter, sans-serif', fontSize: 13, color: 'rgba(255,255,255,0.55)', lineHeight: 1.6, marginBottom: 20 }}>
                  Ready for a trusted driver? Book via WhatsApp or call our hotline anytime.
                </p>
                <button onClick={() => onBookNow && onBookNow()} style={{ display: 'flex', alignItems: 'center', gap: 8, background: ACCENT, color: '#fff', padding: '12px 20px', borderRadius: 10, fontFamily: 'Inter, sans-serif', fontWeight: 600, fontSize: 13, border: 'none', cursor: 'pointer', marginBottom: 12, width: '100%', justifyContent: 'center', boxSizing: 'border-box' }}
                  onMouseEnter={e => e.currentTarget.style.background = '#009960'}
                  onMouseLeave={e => e.currentTarget.style.background = ACCENT}
                >Book on WhatsApp</button>
                <a href="tel:+250785246694" style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8, background: 'rgba(255,255,255,0.08)', border: '1px solid rgba(255,255,255,0.12)', color: '#fff', padding: '12px 20px', borderRadius: 10, fontFamily: 'Inter, sans-serif', fontWeight: 600, fontSize: 13, textDecoration: 'none' }}
                  onMouseEnter={e => e.currentTarget.style.background = 'rgba(255,255,255,0.12)'}
                  onMouseLeave={e => e.currentTarget.style.background = 'rgba(255,255,255,0.08)'}
                >Call Hotline</a>
              </div>
            </div>

            <div style={{ borderTop: '1px solid rgba(255,255,255,0.08)', paddingTop: 24, display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexWrap: 'wrap', gap: 12 }}>
              <span style={{ fontFamily: 'Inter, sans-serif', fontSize: 13, color: 'rgba(255,255,255,0.35)' }}>© 2026 GoSecure. All rights reserved. Kigali, Rwanda.</span>
              <span style={{ fontFamily: 'Inter, sans-serif', fontSize: 13, color: GOLD, fontStyle: 'italic', fontWeight: 500 }}>Safe hands for every journey.</span>
            </div>
          </div>
        </footer>
      );
    };

    // ─── App ──────────────────────────────────────────────────────────────────

    const App = () => {
      const [modalOpen, setModalOpen] = useState(false);
      const openModal = () => setModalOpen(true);
      const closeModal = () => setModalOpen(false);

      return (
        <>
          <Header onBookNow={openModal} />
          <main>
            <Hero onBookNow={openModal} />
            <HowItWorks />
            <WhyGoSecure />
            <UseCases onBookNow={openModal} />
            <BookingForm />
            <About />
            <SafetyPromise />
            <FAQ />
          </main>
          <Footer onBookNow={openModal} />
          <BookingModal open={modalOpen} onClose={closeModal} />
        </>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
